[project]
name = "quic-obj-disk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.2",
    "flask>=3.1.2",
    "grpcio>=1.75.0",
    "grpcio-tools>=1.75.0",
    "loguru>=0.7.3",
    "protobuf>=6.32.1",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.32.5",
]


[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "quic_obj_disk"
namespace = true
