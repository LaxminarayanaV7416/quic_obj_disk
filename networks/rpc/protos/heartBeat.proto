syntax = "proto3";

package object_storage_kernel;

message workerHeartBeat
{
    int64 workerNumber = 1;
    bool alive = 2;
    uint64 timestamp = 3;
}

message mastersHeartBeatResponse
{
    bool recievedHeartBeat = 1;
}

service workerHeartBeatService
{
    rpc sendHeartBeat(workerHeartBeat) returns (mastersHeartBeatResponse) {}
}